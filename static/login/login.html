<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập — Bách Hóa Xanh</title>
    <link rel="stylesheet" href="/static/login/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-store"></i>
                </div>
                <h1>Bách Hóa Xanh</h1>
                <p>Hệ thống quản lý siêu thị</p>
            </div>

            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Mã nhân viên</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Nhập mã nhân viên..." required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <div class="login-error" id="loginError"></div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fa-solid fa-right-to-bracket"></i>&nbsp; Đăng Nhập
                </button>
            </form>
        </div>
        <div class="login-footer">
            © 2026 Bách Hóa Xanh — Hệ Quản Trị CSDL
        </div>
    </div>

    <script src="/static/login/login.js"></script>
</body>
</html>
